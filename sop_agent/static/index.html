<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insurance Claims SOP Agent</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #647184;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --user: #e7f0ff;
      --agent: #ffffff;
      --danger: #9f1239;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 340px;
      min-height: 100vh;
    }
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
      border-right: 1px solid var(--line);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      color: var(--muted);
      background: #fbfcfe;
      white-space: nowrap;
    }
    .chat {
      flex: 1;
      overflow: auto;
      padding: 24px;
    }
    .messages {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      width: fit-content;
      max-width: min(720px, 88%);
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.04);
    }
    .message.agent { background: var(--agent); align-self: flex-start; }
    .message.user { background: var(--user); align-self: flex-end; }
    .composer {
      padding: 16px 22px 20px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    form {
      max-width: 880px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      font: inherit;
      line-height: 1.35;
      color: var(--ink);
      background: #fff;
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      color: var(--accent-ink);
      background: var(--accent);
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    aside {
      padding: 18px;
      background: #fbfcfe;
      overflow: auto;
    }
    .side-section {
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .side-section:first-child { padding-top: 0; }
    h2 {
      margin: 0 0 10px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0;
      color: var(--muted);
    }
    .sample {
      width: 100%;
      min-height: 0;
      text-align: left;
      color: var(--ink);
      background: #eef7f5;
      border: 1px solid #b7d8d3;
      font-weight: 600;
      padding: 10px 12px;
    }
    dl {
      display: grid;
      grid-template-columns: 120px minmax(0, 1fr);
      gap: 8px;
      margin: 0;
      font-size: 13px;
    }
    dt { color: var(--muted); }
    dd { margin: 0; word-break: break-word; }
    pre {
      margin: 0;
      max-height: 420px;
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #101827;
      color: #e5eefb;
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
    @media (max-width: 880px) {
      .shell { grid-template-columns: 1fr; }
      aside { border-top: 1px solid var(--line); }
      main { min-height: 72vh; border-right: 0; }
      header { align-items: flex-start; flex-direction: column; }
      .meta { justify-content: flex-start; }
      form { grid-template-columns: 1fr; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <header>
        <h1>Insurance Claims SOP Agent</h1>
        <div class="meta">
          <span class="pill" id="phase">Phase: loading</span>
          <span class="pill" id="case">Case: none</span>
          <span class="pill" id="email">Email: not offered</span>
        </div>
      </header>
      <section class="chat" id="chat">
        <div class="messages" id="messages"></div>
      </section>
      <section class="composer">
        <form id="form">
          <textarea id="input" placeholder="Type as the caller..." autocomplete="off"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div class="error" id="error" role="alert"></div>
      </section>
    </main>
    <aside>
      <section class="side-section">
        <h2>Sample Test</h2>
        <button class="sample" id="sample" type="button">Use Margaret Chen test message</button>
      </section>
      <section class="side-section">
        <h2>State</h2>
        <dl>
          <dt>Session</dt><dd id="session">starting</dd>
          <dt>Verified</dt><dd id="verified">false</dd>
          <dt>Intent</dt><dd id="intent">none</dd>
        </dl>
      </section>
      <section class="side-section">
        <h2>Trace</h2>
        <pre id="trace">{}</pre>
      </section>
    </aside>
  </div>
  <script>
    const els = {
      messages: document.getElementById("messages"),
      chat: document.getElementById("chat"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      error: document.getElementById("error"),
      phase: document.getElementById("phase"),
      case: document.getElementById("case"),
      email: document.getElementById("email"),
      session: document.getElementById("session"),
      verified: document.getElementById("verified"),
      intent: document.getElementById("intent"),
      trace: document.getElementById("trace"),
      sample: document.getElementById("sample")
    };
    let sessionId = null;

    function addMessage(role, text) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.textContent = text;
      els.messages.appendChild(node);
      els.chat.scrollTop = els.chat.scrollHeight;
    }

    function setBusy(busy) {
      els.send.disabled = busy;
      els.input.disabled = busy;
    }

    function updateState(data) {
      sessionId = data.session_id;
      els.phase.textContent = `Phase: ${data.phase}`;
      els.case.textContent = `Case: ${data.active_case_id || "none"}`;
      els.email.textContent = `Email: ${data.email_status}`;
      els.session.textContent = data.session_id;
      els.verified.textContent = String(data.verified);
      els.intent.textContent = data.resolved_intent || "none";
      els.trace.textContent = JSON.stringify(data.trace || {}, null, 2);
    }

    async function request(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }
      return res.json();
    }

    async function start() {
      setBusy(true);
      try {
        const data = await request("/sessions", { method: "POST" });
        updateState(data);
        addMessage("agent", data.reply);
      } catch (err) {
        els.error.textContent = err.message;
      } finally {
        setBusy(false);
        els.input.focus();
      }
    }

    async function sendMessage(text) {
      if (!text.trim() || !sessionId) return;
      els.error.textContent = "";
      addMessage("user", text.trim());
      els.input.value = "";
      setBusy(true);
      try {
        const data = await request(`/sessions/${sessionId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text.trim() })
        });
        updateState(data);
        addMessage("agent", data.reply);
      } catch (err) {
        els.error.textContent = err.message;
      } finally {
        setBusy(false);
        els.input.focus();
      }
    }

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(els.input.value);
    });
    els.sample.addEventListener("click", () => {
      els.input.value = "I’m the policyholder. My name is Margaret Chen, policy POL-9921. I’m calling about my denied healthcare claim from January. DOB is 1985-03-15, SSN last four is 4472.";
      els.input.focus();
    });
    start();
  </script>
</body>
</html>
