<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insurance Claims Support</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #1c2430;
      --muted: #667085;
      --line: #d8dee8;
      --accent: #0f766e;
      --accent-ink: #ffffff;
      --user: #e7f0ff;
      --agent: #ffffff;
      --danger: #9f1239;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    .shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 22px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 {
      max-width: 880px;
      margin: 0 auto;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0;
    }
    .chat {
      flex: 1;
      overflow: auto;
      padding: 24px;
    }
    .messages {
      max-width: 880px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      width: fit-content;
      max-width: min(720px, 88%);
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 1px 1px rgba(15, 23, 42, 0.04);
    }
    .message.agent {
      background: var(--agent);
      align-self: flex-start;
    }
    .message.user {
      background: var(--user);
      align-self: flex-end;
    }
    .message.typing {
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .dots {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }
    .dots span {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: var(--muted);
      opacity: 0.35;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .dots span:nth-child(2) { animation-delay: 0.15s; }
    .dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes pulse {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
      40% { transform: translateY(-3px); opacity: 0.9; }
    }
    .composer {
      padding: 16px 22px 20px;
      background: var(--panel);
      border-top: 1px solid var(--line);
    }
    form {
      max-width: 880px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: end;
    }
    textarea {
      width: 100%;
      min-height: 48px;
      max-height: 150px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      font: inherit;
      line-height: 1.35;
      color: var(--ink);
      background: #fff;
    }
    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 0 18px;
      font: inherit;
      font-weight: 700;
      color: var(--accent-ink);
      background: var(--accent);
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .error {
      max-width: 880px;
      margin: 8px auto 0;
      color: var(--danger);
      font-size: 13px;
    }
    @media (max-width: 680px) {
      header { padding: 16px; }
      .chat { padding: 18px 14px; }
      .composer { padding: 14px; }
      form { grid-template-columns: 1fr; }
      button { width: 100%; }
      .message { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Insurance Claims Support</h1>
    </header>
    <section class="chat" id="chat">
      <div class="messages" id="messages"></div>
    </section>
    <section class="composer">
      <form id="form">
        <textarea id="input" placeholder="Type your message..." autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </form>
      <div class="error" id="error" role="alert"></div>
    </section>
  </div>
  <script>
    const els = {
      messages: document.getElementById("messages"),
      chat: document.getElementById("chat"),
      form: document.getElementById("form"),
      input: document.getElementById("input"),
      send: document.getElementById("send"),
      error: document.getElementById("error")
    };
    let sessionId = null;
    let typingNode = null;

    function scrollToBottom() {
      els.chat.scrollTop = els.chat.scrollHeight;
    }

    function addMessage(role, text) {
      const node = document.createElement("div");
      node.className = `message ${role}`;
      node.textContent = text;
      els.messages.appendChild(node);
      scrollToBottom();
      return node;
    }

    function showTyping() {
      hideTyping();
      typingNode = document.createElement("div");
      typingNode.className = "message agent typing";
      typingNode.innerHTML = 'Sam is typing <span class="dots" aria-hidden="true"><span></span><span></span><span></span></span>';
      els.messages.appendChild(typingNode);
      scrollToBottom();
    }

    function hideTyping() {
      if (typingNode) {
        typingNode.remove();
        typingNode = null;
      }
    }

    function setBusy(busy) {
      els.send.disabled = busy;
      els.input.disabled = busy;
      if (busy) showTyping();
      else hideTyping();
    }

    async function request(url, options) {
      const res = await fetch(url, options);
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.detail || `Request failed: ${res.status}`);
      }
      return res.json();
    }

    async function start() {
      setBusy(true);
      try {
        const data = await request("/sessions", { method: "POST" });
        sessionId = data.session_id;
        hideTyping();
        addMessage("agent", data.reply);
      } catch (err) {
        els.error.textContent = err.message;
      } finally {
        setBusy(false);
        els.input.focus();
      }
    }

    async function sendMessage(text) {
      if (!text.trim() || !sessionId) return;
      els.error.textContent = "";
      addMessage("user", text.trim());
      els.input.value = "";
      setBusy(true);
      try {
        const data = await request(`/sessions/${sessionId}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text.trim() })
        });
        sessionId = data.session_id;
        hideTyping();
        addMessage("agent", data.reply);
      } catch (err) {
        els.error.textContent = err.message;
      } finally {
        setBusy(false);
        els.input.focus();
      }
    }

    els.form.addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(els.input.value);
    });
    els.input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(els.input.value);
      }
    });
    start();
  </script>
</body>
</html>
